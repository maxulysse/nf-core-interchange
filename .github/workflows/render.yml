name: Render

on:
  pull_request:
  push:
    branches: [main]

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the tree, the stations, the handoffs and the maps
        run: node bin/check.js
      - name: Load every group and every map in headless Chrome and fail on script errors
        run: |
          render() {
            google-chrome --headless=new --no-sandbox --enable-logging=stderr --v=0 --virtual-time-budget=2000 \
              --dump-dom "file://$PWD/index.html$1" 2> chrome.log > dom.html
            if grep -i 'Uncaught' chrome.log; then exit 1; fi
          }
          render ""
          grep -q 'class="tile' dom.html
          for id in $(grep -o 'id: "[a-z0-9-]*"' pipelines.js | cut -d'"' -f2); do
            render "#$id"
            grep -q 'class="tile' dom.html || { echo "group $id did not render"; exit 1; }
          done
          for f in maps/*.js; do
            id=$(basename "$f" .js)
            render "#$id"
            grep -q 'class="stn' dom.html || { echo "map $id did not render"; exit 1; }
          done
