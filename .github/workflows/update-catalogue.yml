name: Update catalogue

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Regenerate catalogue.js from the nf-core website
        run: |
          curl -fsSL https://raw.githubusercontent.com/nf-core/website/main/public/pipelines.json -o "$RUNNER_TEMP/pipelines.json"
          python3 bin/update-catalogue.py "$RUNNER_TEMP/pipelines.json"
          # Only the date changed: no new pipeline, description or release.
          if git diff --quiet -I '^// Generated by' -I '^const CATALOGUE_DATE' catalogue.js; then git checkout catalogue.js; fi

      - id: cpr
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          branch: update-catalogue
          commit-message: "chore: update catalogue.js from the nf-core website"
          title: "Update catalogue.js from the nf-core website"
          body: |
            Weekly refresh of `catalogue.js` by `bin/update-catalogue.py`. If the Render check reports a pipeline missing from the tree, add it to `pipelines.js`.

      # A PR opened with GITHUB_TOKEN starts no pull_request runs, so run the required checks on its branch.
      - name: Run the required checks on the pull request
        if: steps.cpr.outputs.pull-request-operation == 'created' || steps.cpr.outputs.pull-request-operation == 'updated'
        run: |
          gh workflow run render.yml --ref update-catalogue
          gh workflow run linting.yml --ref update-catalogue
        env:
          GH_TOKEN: ${{ github.token }}
