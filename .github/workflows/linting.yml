name: Linting

on:
  pull_request:
  # The weekly catalogue PR is opened with GITHUB_TOKEN, which starts no pull_request runs: it dispatches these.
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  prek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run prek
        uses: j178/prek-action@7b101f8338a08d2bd6fdb3625e4e7692428763a3 # v3.1.1
